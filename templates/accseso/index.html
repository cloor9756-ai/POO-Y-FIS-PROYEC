<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión a MaterialGo </title>
    <!-- Vinculación con tu archivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <!-- Iconos externos para los campos -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>
            
            <form action="" method="POST" class="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" id="username" placeholder="Ej. juan perez" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
