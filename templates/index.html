<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión a MaterialGo</title>
    <!-- Vinculación correcta con tu archivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <!-- Iconos externos para los campos -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: auto; margin-top: 10%; font-family: 'Segoe UI', sans-serif;">
        
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <div id="form-login">
            <h2 style="margin-bottom: 20px; color: #1e1e2f; text-align: center;">Iniciar Sesión</h2>
            <form action="{{ url_for('admin.enlogin') }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" name="username" required placeholder="Usuario" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                <input type="password" name="password" required placeholder="Contraseña" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                <button type="submit" style="background: #0072ff; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Ingresar</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">¿No tienes cuenta? <a href="#" onclick="alternarFormularios()" style="color: #0072ff; text-decoration: none; font-weight: 600;">Regístrate aquí</a></p>
        </div>

        <!-- FORMULARIO DE REGISTRO DE CLIENTES -->
        <div id="form-registro" style="display: none;">
            <h2 style="margin-bottom: 20px; color: #2ecc71; text-align: center;">Registro de Cliente</h2>
            <!-- BUSCA EL FORMULARIO DE REGISTRO DE CLIENTE Y CAMBIA EL ACTION -->
                <form action="{{ url_for('admin.crear_usuario') }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" name="username" required placeholder="Crea tu Usuario" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                <input type="password" name="password" required placeholder="Crea tu Contraseña" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                <textarea name="direccion" required placeholder="Dirección de Entrega Completa" rows="3" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; resize: none;"></textarea>
                <button type="submit" style="background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Crear Cuenta de Cliente</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">¿Ya tienes cuenta? <a href="#" onclick="alternarFormularios()" style="color: #0072ff; text-decoration: none; font-weight: 600;">Inicia Sesión</a></p>
        </div>

    </div>

    <!-- Script interactivo para cambiar entre Login y Registro -->
    <script>
    function alternarFormularios() {
        const login = document.getElementById('form-login');
        const registro = document.getElementById('form-registro');
        if (login.style.display === 'none') {
            login.style.display = 'block';
            registro.style.display = 'none';
        } else {
            login.style.display = 'none';
            registro.style.display = 'block';
        }
    }
    </script>

</body>
</html>
